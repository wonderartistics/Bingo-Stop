name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_VERSION_NAME: "2026.BINGO.100.1"
  APP_VERSION_CODE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run only, safe to repeat)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon & splash screen from /resources
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap copy android

      - name: Set Android version name & code
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${APP_VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${APP_VERSION_NAME}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-stop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bingo Stop ${{ env.APP_VERSION_NAME }} (build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
